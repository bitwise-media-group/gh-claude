# Continuous integration — thin caller for the org's reusable ci workflow. It runs
# the canonical mise tasks (lint, build, test) as one parallel job each, then a
# Codecov upload from coverage/cobertura-coverage.xml (coverage) and
# coverage/junit.xml (test results) — both emitted by `mise run test`. `mise run
# lint` carries all check-mode static analysis — addlicense, golangci-lint,
# govulncheck, markdownlint, prettier --check, actionlint, zizmor. Go comes from
# the root mise.toml pin and the dev CLIs from the toolchain submodule's pins.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@2d3b2608662b272b8e5036236e82144507d8bb67 # v7.0.1
